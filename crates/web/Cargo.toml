[package]
name = "pointblitz-web"
description = "PointBlitz browser target (wasm)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pointblitz-web"
keywords = ["point-cloud", "wasm", "webgpu", "webgl"]
categories = ["graphics", "wasm", "rendering"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
pointblitz-core.workspace = true
# Must equal the wasm-bindgen CLI version (web/build.sh, decision 0028).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "Window", "Document", "console", "Performance"] }
wgpu = "30.0.1"

[features]
# WebGL2 fallback when the browser has no WebGPU (P2.4, decision 0031). Adds about 3.9 MB of wasm;
# `--no-default-features` builds the WebGPU-only module (web/build.sh webgpu, decision 0033).
default = ["webgl"]
webgl = ["wgpu/webgl"]

[lints]
workspace = true
