[package]
name = "pointblitz-web"
description = "PointBlitz browser target (wasm)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pointblitz-core.workspace = true
# Must equal the wasm-bindgen CLI version (web/build.sh, decision 0028).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "Window", "Document", "console"] }
wgpu = "30.0.1"

[lints]
workspace = true
