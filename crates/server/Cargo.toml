[package]
name = "pointblitz-server"
description = "PointBlitz server target: headless render and video streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glam = "0.34"
png = "0.18"
pointblitz-core.workspace = true
pointblitz-io = { workspace = true, features = ["client"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
wgpu = "30.0.1"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# NVENC and the CUDA driver are loaded at run time (decisions 0035, 0043).
libloading = "0.9"

[lints]
workspace = true
