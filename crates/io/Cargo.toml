[package]
name = "pointblitz-io"
description = "PLY stream parser and GPU-ready chunk format for PointBlitz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pointblitz-io"
keywords = ["point-cloud", "ply", "streaming", "parser"]
categories = ["parser-implementations", "graphics"]

[dependencies]
# Only with the `client` feature: event and manifest JSON in the replay client.
serde_json = { version = "1", optional = true }

[features]
# The replay-server client (std::net). Off by default so the core, which depends on this crate,
# never pulls in network code (SPEC §3.1, decision 0003, PR #26 review). native and server enable it.
client = ["dep:serde_json"]


[lints]
workspace = true

# The skyrecon compatibility test lives in tools/skyrecon-compat (outside the workspace, decision 0046).
