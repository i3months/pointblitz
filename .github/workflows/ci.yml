name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace
      - name: wasm check
        run: cargo check --target wasm32-unknown-unknown -p pointblitz-io -p pointblitz-core -p pointblitz-web

  wasm:
    # Browser target (P2.1, decision 0028): wasm build + wasm-bindgen, size reported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen CLI (must equal the crate version)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: build
        run: bash web/build.sh && bash web/build.sh webgpu
      - name: size
        # Public module sizes come from here (PR #21): raw and gzip -9 (transfer) for both modules,
        # default (WebGPU + WebGL2 fallback) and WebGPU-only (decision 0033).
        run: |
          for f in web/pkg/*.wasm web/pkg/*.js web/pkg-webgpu/*.wasm web/pkg-webgpu/*.js; do
            printf '%s raw %s gzip %s\n' "$f" "$(wc -c < "$f")" "$(gzip -9 -c "$f" | wc -c)"
          done
      - name: browser client unit tests (node --test)
        run: node --test web/chunks.test.mjs
